<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Copilot: Enterprise overview</title>
<style>
:root{
  --bg:#080d17;--bg2:#101824;--bg3:#1a2433;--line:#2a3545;--fg:#edf3fb;--mut:#aebacc;
  --acc:#a371f7;--acc2:#58a6ff;--ok:#62d184;--warn:#e3b341;--pink:#db61a2;--teal:#62d4d8;
  --r:16px;--maxw:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:#80bfff;text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #bba7ff;outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h2{font-size:clamp(27px,3vw,34px);letter-spacing:-.025em}
h3{font-size:18px}
p{margin:0 0 .8em}
.mut{color:var(--mut)}
.small{font-size:13px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:9px}

/* nav */
.skip-link{position:fixed;left:12px;top:-60px;z-index:100;background:#fff;color:#111827;padding:9px 14px;border-radius:8px}
.skip-link:focus{top:12px}
nav.top{position:sticky;top:0;z-index:50;background:rgba(8,13,23,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:14px;height:70px}
.brand{display:flex;flex-shrink:0;align-items:center;gap:10px;font-weight:700;white-space:nowrap;color:var(--fg);line-height:1.15}
.brand:hover{text-decoration:none}
.brand .dot{width:34px;height:34px;display:grid;place-items:center;border:1px solid #9a8cff;border-radius:11px;background:linear-gradient(145deg,#6745cc,#3264bd);box-shadow:0 0 20px rgba(137,87,229,.25)}
.brand .dot svg{width:20px;height:20px}
.brand small{display:block;color:var(--mut);font-weight:500;font-size:10px;letter-spacing:.04em;margin-top:3px}
.navlinks{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:var(--mut);padding:7px 10px;border-radius:8px;font-size:13px;white-space:nowrap}
.navlinks a:hover,.navlinks a.on{color:var(--fg);background:var(--bg3);text-decoration:none}
.navmore{position:relative;flex-shrink:0;background:none;border:0;padding:0;margin:0}
.navmore summary{list-style:none;color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.navmore summary::-webkit-details-marker{display:none}
.navmore summary::after{content:"⌄";margin-left:7px}
.nav-label-short{display:none}
.navmore[open] summary{color:var(--fg);border-color:#6e5aaa}
.nav-popover{position:absolute;right:0;top:calc(100% + 10px);width:225px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#111a28;box-shadow:0 18px 45px rgba(0,0,0,.4)}
.nav-popover a{display:block;padding:7px 9px;border-radius:7px;color:var(--mut);font-size:13px}
.nav-popover a:hover,.nav-popover a:focus-visible{color:var(--fg);background:var(--bg3);text-decoration:none}
.nav-popover .mobile-print{display:none;width:100%;margin-top:5px;text-align:left}
.lang{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:#6943b8;color:#fff}
.print{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.storage-notice{padding:9px 22px;background:#372d18;color:#ffe4a3;text-align:center;font-size:13px}

/* hero */
header.hero{position:relative;overflow:hidden;padding:62px 0 56px;background:radial-gradient(750px 480px at 12% 1%,rgba(105,60,184,.22),transparent 70%),radial-gradient(690px 470px at 91% 13%,rgba(31,95,177,.24),transparent 70%),var(--bg)}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(139,160,197,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(139,160,197,.08) 1px,transparent 1px);background-size:50px 50px;mask-image:linear-gradient(#000,transparent 52%)}
header.hero .wrap{position:relative}
.hero-main{display:grid;grid-template-columns:1.03fr .97fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;padding:6px 11px;border:1px solid #4d436c;border-radius:999px;background:rgba(128,87,204,.1);color:#d5c6ff;font-size:11px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#c9a9ff;box-shadow:0 0 14px #b58aff}
header.hero h1{font-size:clamp(46px,5.3vw,68px);letter-spacing:-.055em;line-height:1.05;max-width:650px;margin-bottom:20px}
header.hero h1 span{background:linear-gradient(90deg,#c9adff,#93baff,#74ddd9);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;line-height:1.7;color:#c5d0df;max-width:570px}
.hero-actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}
.hero-button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:46px;padding:10px 17px;border-radius:9px;font-weight:650;font-size:14px}
.hero-button:hover{text-decoration:none;transform:translateY(-1px)}
.hero-button.primary{color:#121329;background:linear-gradient(105deg,#d9c8ff,#a6c8ff);box-shadow:0 8px 26px rgba(137,87,229,.18)}
.hero-button.secondary{color:var(--fg);border:1px solid #4a5870;background:rgba(16,24,36,.75)}
.hero-meta{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:12px;margin:22px 0 0}
.hero-meta::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:var(--teal)}
.hero-visual{position:relative;min-width:0;padding:30px 12px 52px}
.hero-visual::before{content:"";position:absolute;inset:8% 0 14%;border-radius:50%;background:linear-gradient(130deg,rgba(149,88,255,.25),rgba(47,129,247,.12));filter:blur(60px);pointer-events:none}
.scene-window{position:relative;overflow:hidden;border:1px solid #43506a;border-radius:17px;background:#0b111c;box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 0 7px rgba(142,125,203,.045)}
.scene-chrome{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #293345;background:#151d2b;font-size:11px;color:#aab8ca}
.scene-dots{display:flex;gap:5px}
.scene-dots i{width:7px;height:7px;border-radius:50%;background:#617087}
.scene-chrome strong{color:#e6edf3;font-size:12px}
.scene-status{margin-left:auto;color:#a3adc0;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.scene-tabs{display:flex;gap:22px;padding:10px 16px 0;border-bottom:1px solid #273143;color:#8392a8;font-size:11px}
.scene-tabs span{padding:0 0 9px}
.scene-tabs span:first-child{color:#e6edf3;border-bottom:2px solid #a371f7}
.scene-body{display:grid;grid-template-columns:1.05fr .95fr;min-height:220px}
.scene-editor,.scene-chat{min-width:0;padding:16px}
.scene-editor{border-right:1px solid #273143}
.scene-file{font-size:11px;color:#c6d1df;margin-bottom:15px}
.scene-file span{color:#7d8ca2;font-size:10px;float:right}
.scene-code{margin:0;color:#c9d2df;font:11px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:hidden}
.scene-code .line{color:#728198}
.scene-code .purple{color:#c6a9ff}
.scene-code .green{color:#8de4ad}
.scene-diff{display:flex;gap:8px;align-items:center;margin-top:17px;padding:8px;border-radius:7px;background:rgba(47,129,94,.12);color:#a7e6bf;font-size:10px}
.scene-diff i{font-style:normal;font-weight:700}
.scene-agent-heading{display:flex;align-items:center;gap:7px;font-size:12px}
.scene-agent-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#6342a8;color:#fff;font-size:11px}
.scene-agent-mode{margin-left:auto;color:#aab7ca;font-size:10px}
.scene-chat-bubble{margin:14px 0 12px;padding:10px;border:1px solid #334054;border-radius:9px;background:#151f2e;color:#c9d5e4;font-size:11px;line-height:1.5}
.scene-work{display:flex;gap:7px;align-items:center;margin:8px 0;color:#b9c9d6;font-size:10px}
.scene-tick{color:#83dfa0;font-weight:700}
.scene-waiting{display:inline-block;margin-top:9px;padding:4px 7px;border-radius:6px;background:#21314a;color:#c0dcff;font-size:10px}
.scene-bottom{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #273143;color:#9daec2;font-size:10px}
.scene-bottom b{color:#d6e3f2;font-weight:600}
.scene-bottom .sep{color:#6e8098}
.scene-float{position:absolute;right:-5px;top:calc(100% - 44px);display:flex;align-items:center;gap:10px;padding:12px 15px;border:1px solid #53627a;border-radius:12px;background:#172435;box-shadow:0 16px 45px rgba(0,0,0,.35)}
.scene-float-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgba(78,182,135,.16);color:#8ae3b1}
.scene-float b,.scene-float span{display:block}
.scene-float b{font-size:11px}
.scene-float span{color:#aebfd1;font-size:10px}
.visual-caption{position:absolute;left:12px;bottom:12px;color:#9baac0;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:48px}
.stat{display:flex;align-items:center;gap:13px;min-width:0;background:rgba(16,24,36,.68);border:1px solid var(--line);border-radius:12px;padding:15px;color:var(--fg)}
.stat:hover{border-color:#7763a5;text-decoration:none;background:#151e2d}
.stat b{flex:none;font-size:25px;line-height:1;color:#d6c6ff;letter-spacing:-.04em}
.stat span{color:#c0ccdb;font-size:12px;line-height:1.45}
.hero-note{max-width:980px;margin:13px 0 0;color:var(--mut);font-size:12px}
.pathways{margin-top:75px}
.pathways-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.pathways-head h2{margin-bottom:5px}
.pathways-head p{margin:0;max-width:650px}
.pathways-head>a{white-space:nowrap;font-size:13px;font-weight:600}
.tldr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role-path{position:relative;display:flex;flex-direction:column;min-height:178px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(145deg,#151e2c,#101722);color:var(--fg)}
.role-path:hover{border-color:#7763a5;text-decoration:none;transform:translateY(-2px)}
.role-top{display:flex;align-items:center;justify-content:space-between;color:#a894ed;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.role-number{display:grid;place-items:center;width:29px;height:29px;border:1px solid #554b76;border-radius:9px;color:#d7c6ff;letter-spacing:0}
.role-path h3{margin:13px 0 6px;font-size:17px}
.role-path p{color:var(--mut);font-size:13px;line-height:1.55;margin-bottom:12px}
.role-action{margin-top:auto;color:#bba6ff;font-size:12px;font-weight:650}
.guide-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:75px;padding-top:32px;border-top:1px solid var(--line)}
.guide-intro h2{margin-bottom:4px}
.guide-intro p{margin:0}
.guide-intro a{white-space:nowrap;font-size:13px;font-weight:600}

section{padding:70px 0;border-top:1px solid var(--line)}
section:nth-of-type(even){background:#0c131e}
.sechead{max-width:820px;margin-bottom:26px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:19px;position:relative}
.card .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:10px;background:var(--bg3);border:1px solid var(--line)}
.card ul{margin:.3em 0 0;padding-left:18px}.card li{margin:.2em 0}
.src{font-size:12px;margin-top:8px;display:inline-block}
.src::before{content:"↗ "}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:0 4px 4px 0}
.pill.ga{color:var(--ok);border-color:rgba(98,209,132,.5)}
.pill.pv{color:var(--warn);border-color:rgba(227,179,65,.5)}
.pill.vr{color:#8b949e}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;margin-top:10px}
.rung{min-width:0;overflow-wrap:anywhere;background:linear-gradient(180deg,rgba(137,87,229,.25),rgba(47,129,247,.08));border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.rung b{display:block;font-size:14px;margin-bottom:4px}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:8px}
.axis span:nth-child(2){flex:1;margin:0 12px;border-top:1px dashed var(--line);transform:translateY(9px)}

/* surfaces map */
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead th{color:var(--mut);font-weight:600;position:sticky;top:70px;background:var(--bg)}
.y{color:var(--ok);font-weight:700}.p{color:var(--warn);font-weight:700}.n{color:#484f58}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.stage{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.stage-features{grid-column:1/-1;margin-top:8px}
.stage-features-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 14px}
.stage-features-head h3{margin:0}
.stage-features-head p{margin:0}
.stage-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stage-feature{min-width:0;padding:16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#151e2c,#101722)}
.stage-feature h4{font-size:15px;line-height:1.3;margin:7px 0}
.stage-feature p{font-size:13px;line-height:1.55;color:var(--mut);margin:0}
.stage-feature .src{margin-top:10px}
.stage-shared{margin:20px 0 0;padding:16px}
.stage-shared summary{margin-bottom:0}
.stage-shared[open] summary{margin-bottom:16px}
.feature-stages{font-size:12px;color:var(--mut);margin-top:9px}
.pill.product{color:#b6cdf2;border-color:#475d7a}
.lifecycle-note{margin:0 0 18px;padding:12px 15px;border:1px solid #485d78;border-radius:12px;background:#111b2b;color:#c2d0e1;font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.prompt{background:#010409;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d2a8ff;white-space:pre-wrap}

/* mock windows */
.win{background:#010409;border:1px solid var(--line);border-radius:12px;overflow:hidden;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.win .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line);font-family:inherit;color:var(--mut);font-size:12px}
.win .bar i{width:10px;height:10px;border-radius:50%;background:#30363d;display:inline-block}
.win .body{padding:12px 14px;min-height:190px}
.ghost{color:#6e7681}.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.cm{color:#8b949e}.ok{color:var(--ok)}.wa{color:var(--warn)}
.chatb{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;color:#c9d1d9;font-family:-apple-system,Segoe UI,sans-serif}
.label{font-size:11px;color:var(--mut);margin-top:6px}

/* models */
.provs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.prov{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.prov b{display:block;font-size:22px}
.prov.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input{background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:8px 12px;font:inherit;min-width:240px;max-width:100%}
.filter-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.filter-caption{color:var(--mut);font-size:12px}
.chip{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{color:#fff;background:#245fab;border-color:#538fe3}
.empty-state{grid-column:1/-1;color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:12px}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data th{color:var(--mut);font-weight:600;font-size:12.5px}
.bar5{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));vertical-align:middle}

/* fusion */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.level{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg2)}
.level .meter{height:8px;border-radius:4px;background:var(--bg3);margin:8px 0 10px;overflow:hidden}
.level .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--acc))}
.flows{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flow{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg2)}
.flow svg{width:100%;height:150px;display:block}
.node{fill:#1f2630;stroke:#484f58}
.nodeA{fill:rgba(137,87,229,.25);stroke:#8957e5}
.nodeB{fill:rgba(57,197,207,.18);stroke:#39c5cf}
.nodeC{fill:rgba(63,185,80,.18);stroke:#3fb950}
.edge{stroke:#6e7681;stroke-width:1.6;fill:none;stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
svg text{fill:#e6edf3;font:12px -apple-system,Segoe UI,sans-serif;text-anchor:middle;dominant-baseline:middle}
.callout{border:1px solid rgba(137,87,229,.5);background:rgba(137,87,229,.08);border-radius:var(--r);padding:14px 16px;margin-top:16px}

/* pipeline */
.pipe{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:6px 0 4px}
.step{flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--line);padding:12px;position:relative;font-size:13px}
.step:first-child{border-radius:12px 0 0 12px}.step:last-child{border-radius:0 12px 12px 0}
.step b{display:block;font-size:13.5px;margin-bottom:4px}
.step .n2{font-size:11px;color:var(--teal);font-weight:700}
.step+.step{border-left:0}

/* phases */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:ph}
.phase{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:4px solid var(--acc)}
.phase:nth-child(2){border-top-color:var(--acc2)}.phase:nth-child(3){border-top-color:var(--teal)}.phase:nth-child(4){border-top-color:var(--ok)}
.phase h3::before{counter-increment:ph;content:counter(ph) ". ";color:var(--mut)}
.phase .kpi{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}

details{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:.6em 0 0;color:#c9d1d9}

.srcs{columns:2;column-gap:28px;font-size:13.5px}
.srcs h3{break-after:avoid;font-size:14px;margin-top:10px;color:var(--mut)}

 lifecycleNote:{en:'<b>Lifecycle references reviewed 12 Nov 2026.</b> Copilot capabilities and related GitHub security or quality products are labeled separately. Some require additional licenses, AI credits, or enablement; public-repository eligibility varies. Preview and client support can change. Check the <a href="'+U.matrix+'" target="_blank" rel="noopener">feature matrix</a>.',de:'<b>Quellen zum Lebenszyklus geprüft am 12. Nov. 2026.</b> Copilot-Funktionen und zugehörige GitHub-Sicherheits- oder Qualitätsprodukte sind getrennt gekennzeichnet. Manche benötigen zusätzliche Lizenzen, AI Credits oder eine Aktivierung; für öffentliche Repositories gelten teils andere Regeln. Preview und Client-Unterstützung können sich ändern. Siehe <a href="'+U.matrix+'" target="_blank" rel="noopener">Feature-Matrix</a>.'},

 sModP:{en:'The current reference includes models from OpenAI, Anthropic, Google, Microsoft, Moonshot AI, and xAI. Access varies by plan, client, and model policy. See the <a href="'+U.models+'" target="_blank" rel="noopener">supported models</a> page for the current list.',de:'Die aktuelle Referenz enthält Modelle von OpenAI, Anthropic, Google, Microsoft, Moonshot AI und xAI. Der Zugriff hängt von Plan, Client und Modellrichtlinie ab. Die aktuelle Liste steht unter <a href="'+U.models+'" target="_blank" rel="noopener">Supported Models</a>.'},
 sFusK:{en:'Copilot Fusion (formerly HydraFusion)',de:'Copilot Fusion (vormals HydraFusion)'},
 sFusH:{en:'Let Copilot route and combine models',de:'Copilot wählt und kombiniert Modelle'},
 sFusP:{en:'Fusion is GA since 28 Oct 2026. It replaces Auto and picks a model, or a workflow of several models, per request based on the effort level you choose. <a href="'+U.fusionCl+'" target="_blank">Changelog</a> · <a href="'+U.fusion+'" target="_blank">Docs</a>',de:'Fusion ist seit 28. Okt. 2026 GA. Es ersetzt Auto und wählt pro Anfrage ein Modell oder einen Workflow aus mehreren Modellen, abhängig vom gewählten Effort-Level. <a href="'+U.fusionCl+'" target="_blank">Changelog</a> · <a href="'+U.fusion+'" target="_blank">Doku</a>'},
 flowsH:{en:'Three orchestration workflows',de:'Drei Orchestrierungs-Workflows'},
 fusionLineage:{en:'<b>Lineage.</b> HydraFusion started as a research preview that orchestrated several models. Its <a href="'+U.hydraCl+'" target="_blank">14 Oct update</a> added a Max option. With GA it merged with auto model selection into Copilot Fusion. Existing HydraFusion and HydraFusion Max selections move to the matching Fusion levels.',de:'<b>Herkunft.</b> HydraFusion war eine Research Preview zur Orchestrierung mehrerer Modelle. Das <a href="'+U.hydraCl+'" target="_blank">Update vom 14. Okt.</a> brachte die Option Max. Mit GA wurde es mit der automatischen Modellauswahl zu Copilot Fusion zusammengeführt. Bestehende HydraFusion- und HydraFusion-Max-Auswahlen wechseln auf die passenden Fusion-Level.'},
 sAgK:{en:'Agents',de:'Agenten'},
 sAgH:{en:'Which agent for which job',de:'Welcher Agent für welche Aufgabe'},
 sAgP:{en:'Local and GitHub-hosted agents have different execution environments, permissions, and policies. Configure repository protections for changes submitted through pull requests. <a href="'+U.third+'" target="_blank" rel="noopener">Agent policy details</a>',de:'Lokale und auf GitHub ausgeführte Agenten haben unterschiedliche Umgebungen, Berechtigungen und Richtlinien. Repository-Schutzregeln gelten für Änderungen über Pull Requests. <a href="'+U.third+'" target="_blank" rel="noopener">Details zu Agent-Richtlinien</a>'},
 agentHQ:{en:'<b>Agent HQ (public preview).</b> Anthropic Claude and OpenAI Codex can run as coding agents on GitHub through the Copilot subscription. Start a task from the Agents tab, an issue, a pull request, GitHub Mobile, or VS Code. GitHub-hosted access is enabled by policy; local VS Code agents have separate settings. <a href="'+U.third+'" target="_blank" rel="noopener">Docs</a> · <a href="'+U.hqBlog+'" target="_blank" rel="noopener">Blog</a>',de:'<b>Agent HQ (Public Preview).</b> Anthropic Claude und OpenAI Codex können über das Copilot-Abo als Coding-Agenten auf GitHub laufen. Start über Agents-Tab, Issue, Pull Request, GitHub Mobile oder VS Code. Zugriff auf GitHub-gehostete Agenten wird per Richtlinie aktiviert; lokale VS-Code-Agenten haben eigene Einstellungen. <a href="'+U.third+'" target="_blank" rel="noopener">Doku</a> · <a href="'+U.hqBlog+'" target="_blank" rel="noopener">Blog</a>'},

 billing:{en:'<b>Billing model.</b> Usage is measured in AI credits (1 credit = USD 0.01), with token rates depending on the model. Chat, CLI, cloud agent, Spaces and third-party agents can consume credits; included allowances and budgets depend on the plan. Inline completions and next edit suggestions do not consume credits. <a href="'+U.billing+'" target="_blank" rel="noopener">Billing docs</a> · <a href="'+U.plans+'" target="_blank" rel="noopener">Plans</a>',de:'<b>Abrechnung.</b> Die Nutzung wird in AI Credits gemessen (1 Credit = 0,01 USD); der Tokenpreis hängt vom Modell ab. Chat, CLI, Cloud Agent, Spaces und Drittanbieter-Agenten können Credits verbrauchen; enthaltene Kontingente und Budgets hängen vom Plan ab. Inline-Vervollständigungen und Next Edit Suggestions verbrauchen keine Credits. <a href="'+U.billing+'" target="_blank" rel="noopener">Billing-Doku</a> · <a href="'+U.plans+'" target="_blank" rel="noopener">Pläne</a>'},

let storageWarning=false;
function readLanguage(){
 try{return localStorage.getItem('cpLang')==='de'?'de':'en';}
 catch(error){console.warn('Language preference could not be read.',error);storageWarning=true;return 'en';}
}
function rememberLanguage(language){
 try{localStorage.setItem('cpLang',language);}
 catch(error){console.warn('Language preference could not be saved.',error);storageWarning=true;}
}

 $('pipe').innerHTML=PIPE.map(([h,d],i)=>`<div class="step"><span class="n2">${String(i+1).padStart(2,'0')}</span><b>${t(h)}</b><span class="mut">${t(d)}</span></div>`).join('');

 $('ftools').innerHTML=`<input id="fq" type="search" placeholder="${t(D.search)}" aria-label="${t(D.searchFeatures)}"><div class="filter-group" role="group" aria-label="${t(D.roleFilter)}"><span class="filter-caption">${t(D.roleFilter)}</span>`+
  ['all',...Object.keys(ROLES)].map(r=>`<button class="chip${fRole===r?' on':''}" data-r="${r}" aria-pressed="${fRole===r}">${r==='all'?t(D.all):t(ROLES[r])}</button>`).join('')+
  `</div><div class="filter-group" role="group" aria-label="${t(D.statusFilter)}"><span class="filter-caption">${t(D.statusFilter)}</span>`+
  ['all','ga','pv','vr'].map(s=>`<button class="chip${fStat===s?' on':''}" data-s="${s}" aria-pressed="${fStat===s}">${s==='all'?t(D.all):t(STAT[s])}</button>`).join('')+'</div>';

 $('govCards').innerHTML=GOV.map(g=>`<div class="card"><h3>${t(g.h)}</h3><ul class="small">${g.l.map(x=>`<li>${t(x)}</li>`).join('')}</ul>${src(g.u)}</div>`).join('');
 $('phases').innerHTML=PHASES.map(([h,w,l,k])=>`<div class="phase"><h3>${t(h)}</h3><div class="small mut">${t(w)}</div><ul class="small">${l.map(x=>`<li>${t(x)}</li>`).join('')}</ul><div class="kpi">${t(k)}</div></div>`).join('');

function renderTabs(){
 const previous=$('stage').querySelector('.stage-shared');
 if(previous)sharedOpen[Number(previous.dataset.stageIndex)]=previous.open;
 $('tabs').innerHTML=STAGES.map((s,i)=>`<button id="tab-${i}" role="tab" aria-controls="stage" aria-selected="${i===stg}" tabindex="${i===stg?'0':'-1'}" data-t="${i}">${i+1}. ${t(s.k)}</button>`).join('');
 const s=STAGES[stg],mapped=STAGE_FEATURES[stg];
 $('stage').setAttribute('aria-labelledby',`tab-${stg}`);
 $('stage').innerHTML=`<div class="card"><h3>${t(s.k)}</h3><dl class="kv"><dt>${t(SL.what)}</dt><dd>${t(s.what)}</dd><dt>${t(SL.where)}</dt><dd>${t(s.where)}</dd><dt>${t(SL.human)}</dt><dd>${t(s.human)}</dd></dl>${src(s.u)}</div><div class="card"><div class="small mut" style="margin-bottom:6px">${t(SL.prompt)}</div><div class="prompt">${t(s.prompt)}</div></div><div class="stage-features"><div class="stage-features-head"><h3>${t(D.stageFeatures)}</h3><p class="small mut">${mapped.core.length+mapped.shared.length} ${t(D.stageCount)}</p></div><div class="stage-feature-grid">${mapped.core.map(stageCard).join('')}</div><details class="stage-shared" data-stage-index="${stg}"${sharedOpen[stg]?' open':''}><summary>${t(D.stageShared)} (${mapped.shared.length})</summary><div class="stage-feature-grid">${mapped.shared.map(stageCard).join('')}</div></details></div>`;
}
function resolveStageFeature(entry){
 const id=typeof entry==='string'?entry:entry.id;
 const f=FEATURES_BY_ID[id];
 if(!f)throw new Error(`Unknown lifecycle feature: ${id}`);
 return {feature:f,description:typeof entry==='string'||!entry.description?f.description:entry.description};
}
const productPill=f=>`<span class="pill product">${t(PRODUCT[f.product])}</span>`;
function stageCard(entry){
 const {feature:f,description}=resolveStageFeature(entry);
 return `<article class="stage-feature" data-feature="${f.id}"><div>${pill(f.status)} ${productPill(f)}</div><h4>${t(f.name)}</h4><p>${t(description)}</p>${src(f.url)}</article>`;
}
function featureStageIndexes(id){
 return STAGE_FEATURES.flatMap((s,i)=>[...s.core,...s.shared].some(entry=>(typeof entry==='string'?entry:entry.id)===id)?[i]:[]);
}
function renderModels(){
 const q=$('mq').value.toLowerCase();
 const rows=MOD.filter(m=>(!prov||m[1]===prov)&&(!q||(m[0]+' '+m[1]).toLowerCase().includes(q)));
 const body=rows.length?rows.map(m=>`<tr><td><b>${m[0]}</b></td><td><span aria-hidden="true" style="color:${PROV[m[1]]}">●</span> ${m[1]}</td><td>${pill(m[2])}</td><td class="small mut">${t(m[3])}${m[0].startsWith('Claude Fable')?' '+src(U.models):''}</td></tr>`).join(''):`<tr><td colspan="4">${t(D.noResults)}</td></tr>`;
 $('mtable').innerHTML=`<thead><tr><th scope="col">${t(MH.m)}</th><th scope="col">${t(MH.p)}</th><th scope="col">${t(MH.s)}</th><th scope="col">${t(MH.n)}</th></tr></thead><tbody>${body}</tbody>`;
 $('mcount').textContent=`${rows.length} / ${MOD.length} ${t(D.shown)}`;
 document.querySelectorAll('.prov').forEach(b=>{const selected=b.dataset.p===prov;b.classList.toggle('on',selected);b.setAttribute('aria-pressed',selected);});
}
function renderFeatures(){
 const q=($('fq')||{value:''}).value.toLowerCase();
 const rows=FEAT.filter(f=>(fRole==='all'||f.role===fRole)&&(fStat==='all'||f.status===fStat)&&(!q||(t(f.name)+' '+t(f.description)+' '+t(PRODUCT[f.product])).toLowerCase().includes(q)));
 $('fgrid').innerHTML=rows.length?rows.map(f=>`<div class="card"><div>${pill(f.status)} ${productPill(f)} <span class="pill">${t(ROLES[f.role])}</span></div><h3 style="margin-top:6px">${t(f.name)}</h3><p class="small mut">${t(f.description)}</p><div class="feature-stages">${t(D.featureStages)}: ${featureStageIndexes(f.id).map(i=>`<a href="#sdlc" data-stage-link="${i}">${t(STAGES[i].k)}</a>`).join(' · ')}</div>${src(f.url)}</div>`).join(''):`<div class="empty-state" role="status">${t(D.noResults)}</div>`;
 document.querySelectorAll('[data-r]').forEach(b=>{const selected=b.dataset.r===fRole;b.classList.toggle('on',selected);b.setAttribute('aria-pressed',selected);});
 document.querySelectorAll('[data-s]').forEach(b=>{const selected=b.dataset.s===fStat;b.classList.toggle('on',selected);b.setAttribute('aria-pressed',selected);});
}
function renderPrint(){
 $('print-stages').innerHTML=STAGES.map((s,i)=>`<div class="print-stage"><h3>${i+1}. ${t(s.k)}</h3><p><strong>${t(SL.what)}:</strong> ${t(s.what)}</p><p><strong>${t(SL.where)}:</strong> ${t(s.where)}</p><p><strong>${t(SL.human)}:</strong> ${t(s.human)}</p><p><strong>${t(SL.prompt)}:</strong> ${t(s.prompt)}</p>${src(s.u)}<h4>${t(D.stageFeatures)}</h4>${[...STAGE_FEATURES[i].core,...STAGE_FEATURES[i].shared].map(entry=>{const {feature:f,description}=resolveStageFeature(entry);return `<div class="print-stage-feature" data-feature="${f.id}"><strong>${t(f.name)}</strong> <span>(${t(STAT[f.status])} · ${t(PRODUCT[f.product])})</span><p>${t(description)} ${src(f.url)}</p></div>`;}).join('')}</div>`).join('');
 $('print-models').innerHTML=`<table><thead><tr><th>${t(MH.m)}</th><th>${t(MH.p)}</th><th>${t(MH.s)}</th><th>${t(MH.n)}</th></tr></thead><tbody>`+MOD.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${t(STAT[m[2]])}</td><td>${t(m[3])}</td></tr>`).join('')+'</tbody></table>';
 $('print-features').innerHTML=FEAT.map(f=>`<article><h3>${t(f.name)}</h3><p>${t(STAT[f.status])} · ${t(PRODUCT[f.product])} · ${t(ROLES[f.role])}</p><p>${t(f.description)} ${src(f.url)}</p></article>`).join('');
}
document.addEventListener('click',e=>{
 const link=e.target.closest('a');
 if(link&&$('navmore').contains(link))$('navmore').open=false;
 if(link&&link.hasAttribute('data-stage-link')){stg=Number(link.dataset.stageLink);renderTabs();}
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='btn-en'||b.id==='btn-de'){L=b.id.slice(4);rememberLanguage(L);renderStatic();}
 else if(b.dataset.t){stg=+b.dataset.t;renderTabs();}
 else if(b.dataset.p){prov=prov===b.dataset.p?null:b.dataset.p;renderModels();}
 else if(b.dataset.r){fRole=b.dataset.r;renderFeatures();}
 else if(b.dataset.s){fStat=b.dataset.s;renderFeatures();}
});
$('tabs').addEventListener('keydown',e=>{
 if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;
 e.preventDefault();
 stg=e.key==='Home'?0:e.key==='End'?STAGES.length-1:(stg+(e.key==='ArrowRight'?1:STAGES.length-1))%STAGES.length;
 renderTabs();$('tabs').querySelector('[aria-selected=true]').focus();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('navmore').open){$('navmore').open=false;$('navmore').querySelector('summary').focus();}
});
$('mq').addEventListener('input',renderModels);
if('IntersectionObserver' in window){
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)document.querySelectorAll('#navlinks a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-40% 0px -55% 0px'});
 document.querySelectorAll('main section').forEach(s=>io.observe(s));
}
let printFaqState=[];
window.addEventListener('beforeprint',()=>{printFaqState=[...document.querySelectorAll('#faqs details')].map(d=>d.open);document.querySelectorAll('#faqs details').forEach(d=>d.open=true);renderPrint();});
window.addEventListener('afterprint',()=>document.querySelectorAll('#faqs details').forEach((d,i)=>d.open=Boolean(printFaqState[i])));
renderStatic();
</script>
